<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      var KEY = 'orvexa-theme', LEGACY = 'orvexa_theme', root = document.documentElement;
      try {
        var t = localStorage.getItem(KEY);
        if (!t) { t = localStorage.getItem(LEGACY); if (t) localStorage.setItem(KEY, t); }
        if (localStorage.getItem(LEGACY)) localStorage.removeItem(LEGACY);
        if (t === 'dark' || t === 'light') root.setAttribute('data-theme', t);
        window.addEventListener('storage', function (e) {
          if (e.key === KEY && (e.newValue === 'dark' || e.newValue === 'light')) {
            root.setAttribute('data-theme', e.newValue);
          }
        });
      } catch (err) { }
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=signup.html">
  <title>Redirecting to Sign Up - ORVEXA</title>
  <script>
    window.location.replace("signup.html");
  </script>
</head>
<body style="font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #0B0B0A; color: #ECE8E1;">
  <p>Redirecting to <a href="signup.html" style="color: #A47743; font-weight: bold;">Create Account</a>...</p>
</body>
</html>
